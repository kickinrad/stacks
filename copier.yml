# One template, one folder per stack. A stack folder holds one-line includes of
# _shared/ parts; adding a stack is one folder plus one choice below.
_subdirectory: "{{ stack }}"
_answers_file: .copier-answers.yml
_skip_if_exists:
  - AGENTS.md
  - README.md
  - mise.toml
  - .gitignore
  - .claude/settings.json
  - .agents/project.toml
  - biome.jsonc
  - .mcp.json
  - .codex/config.toml
  - lefthook.yml
  - package.json
  - tsconfig.json
  - pyproject.toml
  - src
  - tests
  - tokens.config.mjs
  - tokens
  - playwright.config.ts
  - e2e
  - .secrets.refs
_exclude:
  - "*.partial"
_tasks:
  # Every stack project is a git repository; linters read .gitignore through it.
  - command: "git rev-parse --git-dir >/dev/null 2>&1 || git init -q -b main"
  # A creator's own AGENTS.md is kept; it gains one link to the stack rules.
  - command: "grep -qs 'STACK.md' AGENTS.md || printf '\\nStack rules: [.agents/stack/STACK.md](.agents/stack/STACK.md).\\n' >> AGENTS.md"
  - command: "bun add --dev @biomejs/biome@latest ultracite@latest @astrojs/check@latest typescript@6 @playwright/test@latest @types/bun@latest"
    when: "{{ stack in ['astro', 'emdash'] }}"
  # Adopting the formatter on a fresh starter: format it once, on first copy only.
  # Biome needs a second pass to settle some .astro files (upstream formatter quirk).
  - command: "bun install && bunx ultracite fix && bunx ultracite fix"
    when: "{{ stack in ['astro', 'emdash'] and _copier_operation == 'copy' }}"
  # Seeded MCP configs keep the project's own servers; the stack's required ones are added if missing.
  - command: "python3 {{ _copier_conf.src_path }}/_tasks/ensure_mcp.py . astro-docs=https://mcp.docs.astro.build/mcp"
    when: "{{ stack == 'astro' }}"
  - command: "python3 {{ _copier_conf.src_path }}/_tasks/ensure_mcp.py . astro-docs=https://mcp.docs.astro.build/mcp emdash-docs=https://docs.emdashcms.com/mcp cloudflare=https://mcp.cloudflare.com/mcp"
    when: "{{ stack == 'emdash' }}"
  - command: "bunx skills add emdash-cms/emdash --skill building-emdash-site --skill emdash-cli --skill creating-plugins -a claude-code -a codex -y"
    when: "{{ stack == 'emdash' }}"

stack:
  type: str
  help: Which stack is this project?
  choices:
    A Bun + TypeScript library or tool: bun-lib
    A uv + Python package or tool: python
    An Astro site: astro
    An EmDash site on Cloudflare (extends astro): emdash

project_name:
  type: str
  help: Project name (kebab-case)
  default: "{{ _folder_name }}"
  validator: "{% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}Use lowercase kebab-case{% endif %}"

git_profile:
  type: str
  help: Git flow
  default: component
  choices:
    "component: PR to main, squash": component
    "staged-site: PR to dev, promote dev to main": staged-site

description:
  type: str
  help: One-line description
  default: ""
